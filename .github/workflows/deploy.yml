name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      # 🔴 實作-部-1　`/privacy` 與 `/terms` 要回 **HTTP 200**。
      # GitHub Pages 的 SPA fallback 是「回 404.html 但**狀態碼仍是 404**」——
      # 用瀏覽器開畫面完全正常（實測過），但 Google 的 OAuth 驗證
      # 通常不接受 404 狀態的隱私權政策／服務條款網址。
      # 這兩個是 Google Cloud Console「品牌」頁面填的網址，產成真檔才會回 200。
      - name: Emit real index.html for the legal routes (Google needs HTTP 200)
        run: |
          mkdir -p dist/privacy dist/terms
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/terms/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
