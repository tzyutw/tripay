<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 底色＝S-00 登入頁的漸層（Rozi 2026-09-06：「圖示底色要跟 S-00 一樣」）。
       原本那個磚紅是改成富士青之前的舊視覺方向留下來的（連 theme_color 一起換掉了）。
       角度與色停點逐字對齊 src/index.css 的 .s00wrap：
       linear-gradient(158deg, #0B2233 0%, #0F5E9E 48%, #1276C4 100%)
       158deg 換算成 objectBoundingBox 的座標（不是目測近似）：
         d  = (sin158°, -cos158°) = (0.374607, 0.927184)
         len= |W·sin| + |H·cos|   = 1.30179
         起點 = 中心 - d·len/2，終點 = 中心 + d·len/2 -->
  <defs>
    <linearGradient id="g" x1="0.25617" y1="-0.1035" x2="0.74383" y2="1.1035">
      <stop offset="0"    stop-color="#0B2233"/>
      <stop offset="0.48" stop-color="#0F5E9E"/>
      <stop offset="1"    stop-color="#1276C4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- 實作-R-3　T 的大小與位置是**量出來的**，不是算出來的：
       `實作_圖示T置中.cjs` 把 SVG 畫進 canvas、找出米白像素的邊界框，
       迭代到「墨水高 = 52% 圖高、垂直中心落在 256」才收斂。
       ⚠️ `y` 是**基線**不是中心——原本 y=320／font-size=260 的墨水只佔 35.7%、
       中心還比正中央高 27.5px，所以 Rozi 看到的是「T 太小而且浮在上方沒有置中」。
       ⚠️ 這兩個數字綁著 system-ui 實際的字形，**改字體就要重跑那支腳本**，不要手改。
       purpose="any maskable"：Android 圓形遮罩會吃外圈；
       墨水高 52% 又置中 → 整個 T 都在中央 80%（51.2～460.8）的安全區內。 -->
  <text x="256" y="389" font-family="system-ui, sans-serif" font-size="378.6" font-weight="700"
        text-anchor="middle" fill="#FEF9EE">T</text>
</svg>
