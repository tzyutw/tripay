<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <!-- iOS「加入主畫面」讀的是這一行的 **PNG**，不吃 SVG。
         沒有它，iOS 會退回別的來源、而且**用 URL 當快取鍵**——
         `pwa-icon.svg` 檔名沒變，所以刪掉重加也還是舊圖。
         檔名帶 `-v2` 就是為了讓它重抓。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <!-- 🔴 實作-Y-1　`viewport-fit=cover` 少了它，iOS 不會把安全區交給頁面，
         全站 `env(safe-area-inset-*)` 一律回 0——那六處從來沒生效過，
         於是瀏海那塊由 iOS 用 theme-color 畫、下面那塊由頁面畫，
         兩個顏色就是 Rozi 看到的「底色分兩塊」。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1276C4" />
    <title>Tripay</title>
    <script>
      // Restore URL redirected by 404.html for GitHub Pages SPA support
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
